# Workspace-meta owns only the explicitly listed Codex preference fields.
# Other [history] and [tui] fields remain host-local.

[history]
persistence = "save-all"
max_bytes = 5242880

[tui]
status_line = [
  "project-name",
  "git-branch",
  "pull-request-number",
  "model-with-reasoning",
  "used-tokens",
  "estimated-thread-cost",
  "five-hour-limit",
  "weekly-limit",
]
