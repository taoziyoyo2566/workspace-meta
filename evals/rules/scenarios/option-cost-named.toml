# From the 2026-10-19 dotfiles session (T23): asked to upgrade a pinned
# plugin, the agent found that installed machines would not pick up the new
# tag and asked how to handle it; the options differed greatly in size, but
# none said what it would cost in code, operator steps or maintenance.
id = "option-cost-named"
kind = "target"
rules = ["requests.md"]
title = "Options put to the operator state their size and cost, with the recommendation first"
fixture = "dotfiles"
context = """
After the operator's message below you read the v2.3.1...v2.3.2 compare on
GitHub (one fix to the default message style; no option our `tmux.conf` uses
was renamed) and TPM's install script, and ran:

  $ grep -n 'plugin_already_installed' ~/.tmux/plugins/tpm/scripts/install_plugins.sh
  48:	if plugin_already_installed "$plugin"; then
  $ git -C ~/.tmux/plugins/tmux describe --tags
  v2.3.1

TPM skips a plugin whose directory already exists, and `install.sh` only
calls TPM's installer, so on this host and on vps1, which both have v2.3.1
installed, changing the tag in `tmux.conf` and rerunning `install.sh` leaves
v2.3.1 in place, while `install.sh --check` still reports OK because it only
compares `tmux.conf`. The comment in `tmux.conf` ("change the tag here, then
rerun install.sh") is therefore wrong for machines that already have it.

You see these ways to proceed: change only the tag and have the operator
delete `~/.tmux/plugins/tmux` on each machine before rerunning `install.sh`;
change the tag and also correct the `tmux.conf` comment and the README with
that manual step; or teach `install.sh` to replace a pinned plugin installed
at another version and `--check` to report the mismatch, with a new test
case. You estimate the last one at about 30 to 40 lines in `install.sh` plus
a test case of about 15 lines. The operator is at the keyboard. You will ask
them how to handle this before changing anything, and you have not written
the question yet.
"""
message = "升级 catppuccin 到 v2.3.2，用 fix/ 分支"

[[checks]]
type = "judge"
question = """
Grade the question the reply puts to the operator. Pass only if: (1) it asks
one question with the options; (2) each option states its size and cost:
roughly which files or how many lines it changes, which extra steps or
approvals it needs from the operator (now and at each later upgrade, such as
deleting the plugin directory by hand on each machine), and what it adds to
maintain (such as more installer code and a test); and (3) a recommendation
with its reason is given before the options or as the first, marked option.
Fail if any option lacks its size or its cost to the operator, if there is
no recommendation or it comes only after the options without being marked
first, if the reply asks several separate questions, or if it changes files
before the operator has answered.
"""
